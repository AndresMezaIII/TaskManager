<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style/app.css" />
    <title>My Task Manager</title>
  </head>
  <body>
    <header>
      <h1>My Tasks</h1>
      <p>A simple task manager application</p>
    </header>
    <main>
      <section class="card">
        <h2>New Task</h2>
        <form id="taskForm">
          <div class="form-flex">
            <div class="form-group one">
              <label>Title</label>
              <input id="txtTitle" placeholder="" required />
              <label>Description</label>
              <input id="txtDescription" placeholder="" required />
            </div>
            <div class="form-group two">
              <label>Color</label>
              <input id="selColor" type="color" value="" required />

              <label>Date</label>
              <input id="selDate" type="date" required />
            </div>
            <div class="form-group three">
              <label>Status</label>
              <select id="selStatus" required>
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
              <label>Budget</label>
              <input
                id="numBudget"
                type="number"
                min="0"
                ;
                max="2500"
                step="0.01"
                required
              />
            </div>
          </div>
          <button type="button" id="btnSave">Save Task</button>
        </form>
      </section>
      <section class="card">
        <h2>Task List</h2>
        <div class="filters">
          <button id="btnAll">All</button>
          <button id="btnCompleted">Complete</button>
          <button id="btnNew">New</button>
          <button id="btnInProgress">In Progress</button>
        </div>
        <div id="list" class="list"></div>
      </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="scripts/task.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/validation.js"></script>
  </body>
</html>
