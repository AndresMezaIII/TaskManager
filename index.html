<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style/app.css" />
    <title>My Task Manager</title>
  </head>
  <body>
    <header>
      <h1>My Tasks</h1>
      <p>A simple task manager application</p>
    </header>
    <main>
      <section class="card">
        <h2>New Task</h2>
        <form id="taskForm">
          <div class="form-grid">
            <label>Title <input id="txtTitle" placeholder="" required /></label>
            <label
              >Description <input id="txtDescription" placeholder="" required
            /></label>
            <label
              >Color <input id="selColor" type="color" value="" required
            /></label>

            <label>Date <input id="selDate" type="date" required /></label>
            <label
              >Status
              <select id="selStatus" required>
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </label>
            <label
              >Budget
              <input
                id="numBudget"
                type="number"
                min="0"
                ;
                max="2500"
                step="0.01"
                required
            /></label>
          </div>
          <button type="button" id="btnSave">Save Task</button>
        </form>
      </section>
      <section class="card">
        <h2>Task List</h2>
        <div id="list" class="list"></div>
      </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="scripts/task.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/validation.js"></script>
  </body>
</html>
